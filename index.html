<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interlude — Sync Engine (Phase 1)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app">
    <h1>Interlude — Synchronization Engine</h1>
    <p class="note">Phase 1: no music, no visuals, no flowers — just reliable sync.</p>

    <section id="connection-panel">
      <h2>Connection</h2>
      <p id="connection-status">Connecting...</p>
      <button id="leave-btn">Leave Room</button>
    </section>

    <section id="ready-panel">
      <h2>Ready System</h2>
      <button id="ready-btn" disabled>Ready</button>
      <p id="ready-status">You: Not Ready | Other: Not Ready</p>
    </section>

    <section id="countdown-panel">
      <h2>Shared Countdown</h2>
      <p id="countdown-display"></p>
    </section>

    <section id="player-panel">
      <h2>Shared Playback State</h2>
      <p id="player-state">State: waiting</p>
      <p id="last-action"></p>
      <div id="controls">
        <button id="prev-btn" disabled>Previous</button>
        <button id="play-btn" disabled>Play</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="next-btn" disabled>Next</button>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
